spring:
  application:
    name: main

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: backend-service
              uri: http://localhost:8081
              predicates:
                - Path=/backend/**

server:
  port: 8080

rate-limit:

  default-policy:
    capacity: 10
    refill-rate: 1
    cost: 1

  endpoint-policies:

    /login:
      capacity: 10
      refill-rate: 0.5
      cost: 1

    /search:
      capacity: 30
      refill-rate: 5
      cost: 2

    /premium:
      capacity: 100
      refill-rate: 20
      cost: 1